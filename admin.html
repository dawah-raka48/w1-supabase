<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإدارة</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-dark.css?v=1"><link rel="stylesheet" href="css/logout-modal.css"><link rel="stylesheet" href="css/app-notifications.css?v=2">
</head>
<body>
<div class="dashboard">
<header class="header"><div class="header-right"><img src="assets/logo.png" class="logo" alt="Logo"><div><h2>نظام التقارير الأسبوعية</h2><span>لوحة المدير العام</span></div></div><div class="header-left"><div id="currentTime">00:00</div><div id="currentDate">00/00/0000</div><button id="homeBtn" type="button" aria-label="الرئيسية" title="الرئيسية"><i class="fa-solid fa-house"></i></button><button id="themeBtn" type="button" aria-label="تفعيل الوضع الداكن" title="الوضع الداكن"><i class="fa-solid fa-moon"></i></button><button id="logoutBtn" type="button" aria-label="تسجيل الخروج" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<section class="menu"><button class="menu-card active" data-page="dashboard"><i class="fa-solid fa-chart-pie"></i><span>لوحة التحكم</span></button><button class="menu-card" data-page="reports"><i class="fa-solid fa-file-pdf"></i><span>التقارير</span></button><button class="menu-card" data-page="employees"><i class="fa-solid fa-users"></i><span>الموظفون</span></button><button class="menu-card" data-page="settings"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button><button class="menu-card" type="button" onclick="location.href='executive-reports.html'"><i class="fa-solid fa-layer-group"></i><span>مركز التقارير التنفيذي</span></button></section>
<main id="content"></main>
</div>
<div class="pdf-modal" id="pdfModal" aria-hidden="true"><div class="pdf-modal-card"><div class="pdf-modal-header"><div><strong id="pdfModalTitle">عرض التقرير</strong><span>التقرير الأسبوعي</span></div><button type="button" class="pdf-close" id="pdfClose" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div><iframe id="pdfFrame" title="عرض التقرير" src="about:blank"></iframe></div></div>
<div class="modal" id="employeeModal"><div class="modal-card"><h2 class="modal-title">إضافة موظف</h2><div class="form-grid"><div class="form-group full"><label>اسم الموظف</label><input id="empName" type="text"></div><div class="form-group"><label>القسم</label><select id="empDepartment"><option value="الإدارية">الإدارية</option><option value="المالية">المالية</option><option value="الإعلام">الإعلام</option><option value="قسم الدعوة">قسم الدعوة</option><option value="الجاليات">الجاليات</option><option value="القسم النسائي">القسم النسائي</option><option value="مركز غيم">مركز غيم</option></select></div><div class="form-group"><label>الصلاحية</label><select id="empRole"><option value="employee">موظف</option><option value="manager">مدير قسم</option><option value="admin">مدير عام</option></select></div><div class="form-group"><label>اسم المستخدم</label><input id="empUsername" type="text"></div><div class="form-group"><label>كلمة المرور</label><input id="empPassword" type="password"></div></div><div class="modal-actions"><button class="cancel-btn" id="closeModal">إلغاء</button><button class="save-btn" id="saveEmployee">حفظ الموظف</button></div></div></div>
<script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/api.js?v=2"></script><script src="js/admin.js"></script><script src="js/app-notifications.js?v=2"></script><script src="js/admin-settings.js?v=1"></script><script src="js/logout-modal.js?v=2"></script><script src="js/theme.js?v=1"></script>
<script>document.getElementById('homeBtn')?.addEventListener('click',function(){document.querySelectorAll('.menu-card').forEach(x=>x.classList.remove('active'));const card=document.querySelector('.menu-card[data-page="dashboard"]');card?.classList.add('active');if(typeof loadPage==='function')loadPage('dashboard');});</script>
</body></html>
